<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>ilginicozu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="./libraries/p5.min.js"></script>
  <script src="./tone.js"></script>
</head>

<body>

  <!-- The overlay container -->
  <div id="overlay">
    <div id="overlay-content">
      <p>Click to start the sound</p>
    </div>
  </div>

  <button id="menu-button">
    <!-- <img src="menu.png" alt="Menu" /> -->
      <span class="menu-dot" aria-hidden="true"></span>
  </button>

  <script>
  const overlay = document.getElementById("overlay");

  async function startExperience(e) {
    e.preventDefault();
    e.stopPropagation();
    try { await Tone.start(); } catch (err) {}
    overlay.style.display = "none";
  }

  // iOS Safari is happiest with touchend / pointerup
  overlay.addEventListener("touchend", startExperience, { passive: false });
  overlay.addEventListener("pointerup", startExperience);
  overlay.addEventListener("click", startExperience);
</script>


  <script src="sketch.js">
  </script>
  <script>
    document.getElementById('menu-button')
      .addEventListener('click', () => {
        window.open('https://ilginicozu.com', '_blank');
      });
  </script>


</body>

</html>
